
<!DOCTYPE html>
<html>
<head>
    <title>Add Owner</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="max-w-md mx-auto mt-20 bg-white p-6 rounded shadow">
    <h2 class="text-xl font-bold mb-4">Add Turf Owner</h2>

    {{ if .error }}
    <div class="bg-red-100 text-red-700 p-3 mb-4 rounded">
        {{ .error }}
    </div>
    {{ end }}

    <form method="POST">
        <input name="name" placeholder="Name" class="w-full mb-3 p-2 border rounded">
        <input name="email" placeholder="Email" class="w-full mb-3 p-2 border rounded">
        <input name="password" type="password" placeholder="Password"
               class="w-full mb-3 p-2 border rounded">

        <button class="w-full bg-blue-600 text-white py-2 rounded">
            Create Owner
        </button>
    </form>
</div>

</body>
</html>
