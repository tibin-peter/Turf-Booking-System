<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Turf</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<header class="bg-gradient-to-r from-blue-700 to-blue-600 text-white p-5 shadow">
    <h1 class="text-2xl font-bold text-center">Turf Booking Admin Panel</h1>
</header>

<div class="flex">

    <aside class="w-64 bg-white shadow-lg min-h-screen p-5 space-y-2 border-r">
        <a href="/admin/dashboard" class="block p-3 rounded hover:bg-gray-100" >Dashboard</a>
        <a href="/admin/turfs" class="block p-3 rounded bg-blue-50 text-blue-700 font-semibold">Manage Turfs</a>
        <a href="/admin/bookings" class="block p-3 rounded hover:bg-gray-100">Manage Bookings</a>
        <a href="/admin/payments" class="block p-3 rounded hover:bg-gray-100">Manage Payments</a>
        <a href="/admin/users" class="block p-3 rounded hover:bg-gray-100">Manage Users</a>
        <a href="/admin/owners" class="block p-3 rounded hover:bg-gray-100">Manage Owners</a>
        <hr class="my-3">
        <a href="/admin/logout" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 font-semibold">
            Logout
        </a>
    </aside>

    <main class="flex-1 p-6 max-w-xl">

        <h1 class="text-2xl font-bold mb-6">Edit Turf</h1>

        <form action="/admin/turfs/edit/{{ .Turf.ID }}" method="POST" class="space-y-4">

            <div>
                <label class="font-semibold">Turf Name</label>
                <input name="name" value="{{ .Turf.Name }}" class="w-full border p-2 rounded">
            </div>

            <div>
                <label class="font-semibold">Location</label>
                <input name="location" value="{{ .Turf.Location }}" class="w-full border p-2 rounded">
            </div>

            <div>
                <label class="font-semibold">Price Per Hour (₹)</label>
                <input type="number" name="price" value="{{ .Turf.PricePerHour }}" class="w-full border p-2 rounded">
            </div>

            <div>
                <label class="font-semibold">Description</label>
                <textarea name="description" rows="4" class="w-full border p-2 rounded">{{ .Turf.Description }}</textarea>
            </div>

            <button class="px-4 py-2 bg-green-600 text-white rounded">Update Turf</button>

        </form>

    </main>
</div>

</body>
</html>
