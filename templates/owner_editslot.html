<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Slot</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<header class="bg-green-700 text-white p-5 shadow">
    <h1 class="text-2xl font-bold text-center">Turf Owner Dashboard</h1>
</header>

<div class="flex">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-white shadow min-h-screen p-5 space-y-2">
        <a href="/owner/dashboard" class="block p-3 rounded hover:bg-gray-100">Dashboard</a>
        <a href="/owner/turfs" class="block p-3 rounded bg-green-100 text-green-700 font-semibold">
            My Turfs
        </a>
        <a href="/owner/bookings" class="block p-3 rounded hover:bg-gray-100">Bookings</a>
        <a href="/owner/payments" class="block p-3 rounded hover:bg-gray-100">Payments</a>

        <a href="/owner/logout"
           class="block p-3 rounded bg-red-50 text-red-600 font-semibold mt-6">
            Logout
        </a>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 p-8">

        <div class="mb-6">
            <h2 class="text-3xl font-bold text-gray-800">Edit Slot</h2>
            <p class="text-gray-500">Modify slot details</p>
        </div>

        {{ if .error }}
        <div class="mb-4 bg-red-100 text-red-700 p-4 rounded">
            {{ .error }}
        </div>
        {{ end }}

        <div class="bg-white p-6 rounded shadow max-w-lg">

            <form method="POST" class="space-y-4">

                <div>
                    <label class="block text-sm font-semibold mb-1">Date</label>
                    <input type="date" name="day"
                           value="{{ .Slot.Day.Format "2006-01-02" }}"
                           required
                           class="w-full border rounded p-2">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Start Time</label>
                    <input type="time" name="start_time"
                           value="{{ .Slot.StartTime }}"
                           required
                           class="w-full border rounded p-2">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">End Time</label>
                    <input type="time" name="end_time"
                           value="{{ .Slot.EndTime }}"
                           required
                           class="w-full border rounded p-2">
                </div>

                <div class="flex justify-between pt-4">
                    <a href="/owner/turfs/{{ .Slot.TurfID }}/slots"
                       class="text-gray-600 font-semibold hover:underline">
                        Cancel
                    </a>
                    <button class="bg-green-600 text-white px-6 py-2 rounded font-semibold hover:bg-green-700">
                        Update Slot
                    </button>
                </div>

            </form>

        </div>

    </main>
</div>

</body>
</html>
