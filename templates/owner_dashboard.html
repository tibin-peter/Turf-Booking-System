<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Owner Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gray-100">

<header class="bg-green-700 text-white p-5 shadow">
    <h1 class="text-2xl font-bold text-center">Turf Owner Dashboard</h1>
</header>

<div class="flex">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-white shadow min-h-screen p-5 space-y-2">
        <a href="/owner/dashboard" class="block p-3 rounded bg-green-100 text-green-700 font-semibold">
            Dashboard
        </a>
        <a href="/owner/turfs" class="block p-3 rounded hover:bg-gray-100">My Turfs</a>
        <a href="/owner/bookings" class="block p-3 rounded hover:bg-gray-100">Bookings</a>
        <a href="/owner/payments" class="block p-3 rounded hover:bg-gray-100">Payments</a>

        <a href="/owner/logout"
           class="block p-3 rounded bg-red-50 text-red-600 font-semibold mt-6">
            Logout
        </a>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 p-8">

        <!-- STATS -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded shadow border-l-4 border-green-600">
                <p class="text-gray-500 text-sm">My Turfs</p>
                <p class="text-3xl font-bold">{{ .TotalTurfs }}</p>
            </div>

            <div class="bg-white p-6 rounded shadow border-l-4 border-blue-600">
                <p class="text-gray-500 text-sm">Total Slots</p>
                <p class="text-3xl font-bold">{{ .TotalSlots }}</p>
            </div>

            <div class="bg-white p-6 rounded shadow border-l-4 border-yellow-500">
                <p class="text-gray-500 text-sm">Today's Bookings</p>
                <p class="text-3xl font-bold">{{ .TodayBookings }}</p>
            </div>
        </div>

        <!-- CHARTS -->
        <div class="grid grid-cols-1 xl:grid-cols-2 gap-8">

            <div class="bg-white p-6 rounded shadow">
                <h3 class="font-semibold mb-4">Weekly Bookings</h3>
                <canvas id="weekChart"></canvas>
            </div>

            <div class="bg-white p-6 rounded shadow">
                <h3 class="font-semibold mb-4">Monthly Revenue</h3>
                <canvas id="revenueChart"></canvas>
            </div>

        </div>

    </main>
</div>

<script>
new Chart(document.getElementById("weekChart"), {
    type: "line",
    data: {
        labels: {{ .WeekLabels }},
        datasets: [{
            label: "Bookings",
            data: {{ .WeekValues }},
            borderColor: "#16a34a",
            backgroundColor: "rgba(22,163,74,0.2)",
            fill: true,
            tension: 0.4
        }]
    }
});

new Chart(document.getElementById("revenueChart"), {
    type: "bar",
    data: {
        labels: {{ .MonthLabels }},
        datasets: [{
            label: "Revenue (₹)",
            data: {{ .MonthValues }},
            backgroundColor: "#22c55e"
        }]
    }
});
</script>

</body>
</html>
